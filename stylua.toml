# WoW 3.3.5a runs Lua 5.1 — no goto, no integer division, no bitwise ops.
syntax = "Lua51"
column_width = 120
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"

[sort_requires]
enabled = false
