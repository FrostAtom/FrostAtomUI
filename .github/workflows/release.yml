name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check TOC versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          for toc in FrostAtomUI/FrostAtomUI.toc FrostAtomUI_Config/FrostAtomUI_Config.toc; do
            toc_version="$(sed -n 's/^## Version: *\([^[:space:]]*\).*/\1/p' "$toc")"
            if [ "$toc_version" != "$version" ]; then
              echo "::error file=$toc::Version $toc_version does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Check version markers
        run: python3 tools/check_versions.py --release --tag "$GITHUB_REF_NAME"

      - name: Build zip
        run: |
          git archive --format=zip -o "FrostAtomUI-${GITHUB_REF_NAME#v}.zip" HEAD FrostAtomUI FrostAtomUI_Config
          cp "FrostAtomUI-${GITHUB_REF_NAME#v}.zip" FrostAtomUI.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "FrostAtomUI-${GITHUB_REF_NAME#v}.zip" FrostAtomUI.zip --title "FrostAtom UI ${GITHUB_REF_NAME#v}" --generate-notes
